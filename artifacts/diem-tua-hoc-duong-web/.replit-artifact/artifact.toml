kind = "web"
previewPath = "/"
title = "Điểm Tựa Học Đường"
description = "Website đồng hành cùng học sinh với hỗ trợ tinh thần, trò chuyện AI Gemini, tài nguyên học tập, cộng đồng, theo dõi cảm xúc, tư vấn nghề nghiệp và công cụ học tập."
version = "1.0.0"
id = "artifacts/diem-tua-hoc-duong-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22053

[services.development]
run = "pnpm --filter @workspace/diem-tua-hoc-duong-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diem-tua-hoc-duong-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/diem-tua-hoc-duong-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22053"
BASE_PATH = "/"
